[settings]
experimental = true
quiet = true
task_output = "interleave"
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[shell_alias]
header = '''printf '\n== %s ==\n''''

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
# Task runtimes and command-line utilities
"aqua:nushell/nushell" = "0.115.0"
"aqua:shenwei356/rush" = "0.9.0"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
gh = "2.98.0"
gum = "2.0.0"
jq = "1.8.2"
usage = "5.1.0"
yq = "4.53.6"

# Shared KKL packages
"shiv:browser" = "0.2"
"shiv:chat" = "0.2"
"shiv:codebase" = "0.4"
"shiv:comments" = "0.3"
"shiv:emails" = "0.7"
"shiv:modules" = "0.9"
"shiv:notes" = "0.10"
"shiv:rudi" = "0.5"
"shiv:secrets" = "0.2"
"shiv:sessions" = "0.5"
"shiv:shimmer" = "0.1"
"shiv:threads" = "0.3"
"shiv:websites" = "0.1"

[_.codebase]
name = "fold"
lint = ["mise-settings", "gum-table"]

[_.codebase.scope]
gum-table = ".mise/tasks"
